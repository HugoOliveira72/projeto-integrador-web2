{% extends "base.html" %}

{%block conteudo%}

<form id="form-cadastro" method="POST" action="{{ url_for('autenticacao.cadastro') }}">
    <h2>Criar conta</h2>
    <label for="nome">Nome: </label>
    <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required>
    <br><br>

    <label for="email">E-mail: </label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required>
    <br><br>

    <label for="senha">Senha (6 a 20 caracteres): </label>
    <input type="password" id="senha" name="senha" required>
    <br><br>

    <label for="confirmar">Confirmar senha: </label>
    <input type="password" id="confirmar" name="confirmar" required>
    <br><br>

    <p id="error" role="alert" aria-live="polite"></p>

    <button type="submit">Cadastrar</button>

    <p>Já possui uma conta? <a href="{{ url_for('autenticacao.login') }}">Entrar</a>.</p>


</form>

{%endblock%}
